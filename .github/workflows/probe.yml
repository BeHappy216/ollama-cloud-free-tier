name: Probe free cloud models

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Optional single model to probe, for example glm-5.1:cloud"
        required: false
        type: string
      max_models:
        description: "Maximum models to probe when model is empty"
        required: false
        default: "100"
        type: string
      delay_seconds:
        description: "Delay seconds between probes"
        required: false
        default: "3"
        type: string
      max_search_pages:
        description: "Maximum public cloud search pages to inspect"
        required: false
        default: "10"
        type: string
      max_family_pages:
        description: "Maximum model family pages to inspect"
        required: false
        default: "100"
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest

    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_FREE_API_KEY }}
      INPUT_MODEL: ${{ inputs.model }}
      INPUT_MAX_MODELS: ${{ inputs.max_models }}
      INPUT_DELAY_SECONDS: ${{ inputs.delay_seconds }}
      INPUT_MAX_SEARCH_PAGES: ${{ inputs.max_search_pages }}
      INPUT_MAX_FAMILY_PAGES: ${{ inputs.max_family_pages }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Discover cloud models
        run: |
          MAX_SEARCH_PAGES="${INPUT_MAX_SEARCH_PAGES:-10}"
          MAX_FAMILY_PAGES="${INPUT_MAX_FAMILY_PAGES:-100}"
          uv run python scripts/discover.py \
            --max-search-pages "$MAX_SEARCH_PAGES" \
            --max-family-pages "$MAX_FAMILY_PAGES"

      - name: Probe models
        run: |
          MAX_MODELS="${INPUT_MAX_MODELS:-100}"
          DELAY_SECONDS="${INPUT_DELAY_SECONDS:-3}"
          if [ -n "$INPUT_MODEL" ]; then
            uv run python scripts/probe.py \
              --model "$INPUT_MODEL" \
              --delay-seconds "$DELAY_SECONDS"
          else
            uv run python scripts/probe.py \
              --all \
              --max "$MAX_MODELS" \
              --delay-seconds "$DELAY_SECONDS"
          fi

      - name: Render README
        run: uv run python scripts/render_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/ README.md
            git commit -m "Update Free-tier Ollama cloud model status" || echo "Nothing staged, skipping commit"
            git push
          else
            echo "No changes to commit"
          fi
